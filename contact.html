<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系我们 · 东莞简依玩具有限公司</title>
  <link rel="icon" href="assets/img/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=16" />
</head>
<body data-page="contact">
  <div id="app-header"></div>

  <main>
    <!-- Inquiry form -->
    <section id="inquiry" class="section">
      <div class="container">
        <p class="section-index">07</p>
        <h2 class="section-title" data-i18n="form.title">咨询表单</h2>
        <p class="section-lead" data-i18n="form.lead">填写以下信息，我们将在 24 小时内回复您。</p>
        <form id="inquiry-form" class="inquiry-form glass" novalidate>
          <div class="form-grid">
            <label><span data-i18n="form.name">姓名</span><input type="text" name="name" required /></label>
            <label><span data-i18n="form.company">公司名称</span><input type="text" name="company" required /></label>
            <label><span data-i18n="form.email">电子邮箱</span><input type="email" name="email" required /></label>
            <label><span data-i18n="form.country">国家 / 地区</span><input type="text" name="country" /></label>
            <label class="form-wide"><span data-i18n="form.qty">预计数量</span><input type="text" name="qty" /></label>
            <label class="form-wide"><span data-i18n="form.msg">咨询内容</span><textarea name="msg" rows="5" required></textarea></label>
          </div>
          <button type="submit" class="btn btn-primary" data-i18n="form.send">发送咨询</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
          <p class="form-note" data-i18n="form.note">点击发送后，咨询内容将直接发送至我们的商务邮箱。</p>
        </form>
      </div>
    </section>

    <section id="contact" class="cta">
      <div class="container cta-inner">
        <h2 class="cta-title" data-i18n="cta.title">诚邀合作 · 共创未来</h2>
        <p class="cta-sub" data-i18n="cta.sub">15 年来，我们坚守品质为本、客户至上，以专业制造能力与严格品质管理赢得全球顶级品牌长期信赖。期待与您携手，共同创造更多优质产品。</p>
        <div class="contact-cards contact-cards-single">
          <div class="contact-card contact-card-accent">
            <h3 data-i18n="cta.c3t">商务洽谈</h3>
            <p class="contact-email"><a href="mailto:janetoys@jane-toys.com">janetoys@jane-toys.com</a></p>
            <span class="contact-tag" data-i18n="cta.c3tag">欢迎来样定制 · 品牌代工</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
  <script src="i18n.js?v=16"></script>
  <script src="layout.js?v=16"></script>
  <script src="script.js?v=16"></script>
</body>
</html>
